name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q app backend scripts tests run_app.py
      - run: python -m ruff check app backend scripts tests run_app.py
      - run: python -m ruff format --check app backend scripts tests run_app.py
      - run: python -m mypy app scripts
      - run: python -m pytest --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check frontend/app.js
